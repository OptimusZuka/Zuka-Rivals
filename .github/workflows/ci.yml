name: Verificacao

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compilar-e-verificar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar
        run: dotnet build IRacingTracker.csproj -c Release --nologo
      - name: Verificacao de seguranca (padroes de antivirus)
        shell: bash
        run: bash scripts/verificar.sh
