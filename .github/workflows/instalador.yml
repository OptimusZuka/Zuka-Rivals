name: Instalador

# Gera ZukaRivals.exe (com o .NET incluido) e o instalador ZukaRivals-Setup.exe numa maquina Windows limpa do GitHub.
# Corre ao criar uma etiqueta v* ou manualmente (Actions > Instalador > Run workflow).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: windows-latest
    env:
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verificacao de seguranca (padroes de antivirus)
        shell: bash
        run: bash scripts/verificar.sh

      - name: Publicar (win-x64, com .NET incluido)
        run: dotnet publish IRacingTracker.csproj -c Release -o publish --nologo

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      # Assinatura Authenticode (opcional): so corre se o certificado existir como segredos do repositorio
      # (SIGN_PFX_BASE64 e SIGN_PFX_PASSWORD). Ordem correta: primeiro o ZukaRivals.exe, depois o instalador,
      # o desinstalador e o executavel temporario do instalador (o Inno Setup assina-os com o mesmo certificado).
      - name: Assinar o executavel principal (opcional)
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$PWD\cert.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          "SIGNTOOL=$signtool" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          & $signtool sign /f cert.pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 publish\ZukaRivals.exe
          if ($LASTEXITCODE -ne 0) { throw "Falha a assinar ZukaRivals.exe" }

      - name: Criar instalador
        shell: pwsh
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if (-not $v -or $v -eq 'main') { $v = '1.0.0' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if ($env:SIGN_PFX_BASE64 -ne '' -and $env:SIGNTOOL) {
            $cmd = '"' + $env:SIGNTOOL + '" sign /f "' + "$PWD\cert.pfx" + '" /p "' + $env:SIGN_PFX_PASSWORD + '" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $f'
            & $iscc "installer\ZukaRivals.iss" "/DAppVersion=$v" "/DSign=1" "/Szuka=$cmd"
          } else {
            & $iscc "installer\ZukaRivals.iss" "/DAppVersion=$v"
          }
          if ($LASTEXITCODE -ne 0) { throw "Falha a criar o instalador" }

      - name: Verificar assinaturas
        shell: pwsh
        run: |
          Get-ChildItem Output\*.exe, publish\ZukaRivals.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host ("{0}: {1} {2}" -f $_.Name, $sig.Status, $sig.SignerCertificate.Subject)
            if ($env:SIGN_PFX_BASE64 -ne '' -and $sig.Status -ne 'Valid') { throw "Assinatura invalida em $($_.Name)" }
          }
          if ($env:SIGN_PFX_BASE64 -eq '') { Write-Host "AVISO: sem certificado, os executaveis NAO estao assinados." }
          Remove-Item cert.pfx -ErrorAction SilentlyContinue

      - name: Analise do Windows Defender
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Host "Defender indisponivel neste executor; analise ignorada."; exit 0 }
          Get-ChildItem Output\*.exe | ForEach-Object {
            & $mp -Scan -ScanType 3 -File $_.FullName -DisableRemediation
            Write-Host "$($_.Name): codigo de saida $LASTEXITCODE (0 = limpo)"
            if ($LASTEXITCODE -eq 2) { throw "O Defender detetou algo em $($_.Name)" }
          }

      - name: Pacote portatil (zip, sem instalador)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if (-not $v -or $v -eq 'main') { $v = '1.0.0' }
          Copy-Item LEIA-ME.txt publish\LEIA-ME.txt
          Compress-Archive -Path publish\* -DestinationPath "Output\ZukaRivals-$v-portatil.zip"

      - name: Somas SHA-256
        shell: pwsh
        run: |
          Get-FileHash Output\*.exe, Output\*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Tee-Object -FilePath Output\SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ZukaRivals-Setup
          path: Output/*

      - name: Anexar a release (so em etiquetas)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" Output/* --title "Zuka Rivals ${{ github.ref_name }}" \
            --notes "Instalador e somas SHA-256. Podes enviar o Setup ao VirusTotal antes de instalar." || \
          gh release upload "${{ github.ref_name }}" Output/* --clobber
